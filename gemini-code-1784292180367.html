<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRC Live Rankings</title>
<style>
  :root {
    --bg-color: #121212;
    --card-bg: #1e1e1e;
    --text-primary: #e0e0e0;
    --text-secondary: #aaaaaa;
    --accent: #bb86fc;
    --highlight: #03dac6;
    --highlight-bg: rgba(3, 218, 198, 0.15);
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  
  /* --- Setup Screen --- */
  #setup-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 20px;
    box-sizing: border-box;
  }
  #setup-screen h2 {
    margin-bottom: 25px;
    color: var(--accent);
  }
  .input-group {
    margin-bottom: 15px;
    width: 100%;
    max-width: 400px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    color: var(--text-secondary);
    font-size: 0.9em;
  }
  input {
    width: 100%;
    padding: 12px;
    border: 1px solid #333;
    border-radius: 6px;
    background-color: var(--card-bg);
    color: var(--text-primary);
    box-sizing: border-box;
    font-size: 1em;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    max-width: 400px;
    padding: 14px;
    margin-top: 10px;
    background-color: var(--accent);
    color: #121212;
    border: none;
    border-radius: 6px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  button:hover {
    background-color: #a370f0;
  }
  .error { color: #cf6679; text-align: center; margin-top: 15px; font-size: 0.9em; }
  
  /* --- Rankings Screen --- */
  #rankings-screen {
    display: none;
    flex-direction: column;
    height: 100%;
  }
  .header {
    background-color: var(--card-bg);
    padding: 15px 20px;
    text-align: center;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    z-index: 10;
    position: relative;
  }
  .header h1 { margin: 0; font-size: 1.4em; }
  .header p { margin: 5px 0 0; color: var(--text-secondary); font-size: 0.9em; }
  .last-updated { color: var(--highlight); font-size: 0.85em; margin-top: 8px; font-weight: bold; text-align: center;}
  
  .back-btn {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    color: var(--accent);
    width: auto;
    padding: 8px 12px;
    margin: 0;
  }
  .back-btn:hover { background-color: rgba(187, 134, 252, 0.1); }
  
  /* Table / Grid Layout */
  .rankings-container {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .rankings-container::-webkit-scrollbar {
    display: none;
  }
  
  .row {
    display: grid;
    /* Mobile: 4 columns */
    grid-template-columns: 2fr 3fr 3fr 3fr; 
    background-color: var(--card-bg);
    margin-bottom: 8px;
    padding: 14px 10px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--text-primary);
    align-items: center;
    transition: transform 0.1s, background-color 0.2s;
    border-left: 6px solid transparent; /* Placeholder for highlight stripe */
  }
  .row:hover {
    transform: scale(1.01);
    background-color: #2a2a2a;
  }
  
  /* --- Highlighted Team Styling --- */
  .row.highlight {
    background-color: var(--highlight-bg);
    border: 1px solid var(--highlight);
    border-left: 6px solid var(--highlight);
    box-shadow: 0 0 12px rgba(3, 218, 198, 0.3);
  }
  .row.highlight .team {
    color: var(--highlight);
    font-size: 1.4em;
    text-shadow: 0 0 8px rgba(3, 218, 198, 0.5);
  }
  .row.highlight .rank {
    color: var(--highlight);
  }

  .row.header-row {
    background-color: rgba(18, 18, 18, 0.9);
    color: var(--text-secondary);
    font-weight: bold;
    text-transform: uppercase;
    font-size: 0.75em;
    position: sticky;
    top: 0;
    z-index: 5;
    backdrop-filter: blur(4px);
    margin-bottom: 10px;
    padding-top: 10px;
    padding-bottom: 10px;
    border: none;
  }
  .row.header-row:hover { transform: none; background-color: rgba(18, 18, 18, 0.9); }
  
  .cell { text-align: right; }
  .cell:nth-child(1), .cell:nth-child(2) { text-align: left; }
  
  .rank { font-size: 1.2em; font-weight: bold; color: var(--accent); }
  .team { font-size: 1.2em; font-weight: bold; transition: all 0.2s; }
  
  /* Desktop extensions */
  .desktop-only { display: none; }
  
  @media (min-width: 768px) {
    /* Desktop: 7 columns */
    .row { grid-template-columns: 1fr 2fr 2fr 2fr 2fr 2fr 2fr; }
    .desktop-only { display: block; }
    .rankings-container { padding: 20px; max-width: 1000px; margin: 0 auto; width: 100%; box-sizing: border-box;}
  }
  
  .loading {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-secondary);
    font-size: 1.1em;
  }
  
  .bottom-updated {
    padding: 20px;
    text-align: center;
    color: var(--highlight);
    font-size: 0.85em;
    font-weight: bold;
  }
</style>
</head>
<body>

<!-- Setup Screen -->
<div id="setup-screen">
  <h2>FRC Live Rankings</h2>
  
  <div class="input-group">
    <label for="tba-key">TBA Read API Key (Saved locally)</label>
    <input type="password" id="tba-key" placeholder="Enter your TBA Auth Key">
  </div>
  
  <div class="input-group">
    <label for="team-number">Your Team Number (Optional, populates events)</label>
    <input type="number" id="team-number" placeholder="e.g. 254">
  </div>

  <div class="input-group">
    <label for="year">Year</label>
    <input type="number" id="year" placeholder="e.g. 2026">
  </div>
  
  <div class="input-group">
    <label for="event-code">Event Code</label>
    <input type="text" id="event-code" placeholder="e.g. 2026txhou" list="event-suggestions">
    <datalist id="event-suggestions"></datalist>
  </div>
  
  <button id="load-btn">Load Rankings</button>
  <div id="error-msg" class="error"></div>
</div>

<!-- Rankings Display Screen -->
<div id="rankings-screen">
  <div class="header">
    <button class="back-btn" id="back-btn">← Back</button>
    <h1 id="event-title">Event Rankings</h1>
    <p id="event-subtitle">Loading...</p>
    <div id="last-updated-top" class="last-updated"></div>
  </div>
  
  <div class="rankings-container" id="scroll-container">
    <div class="row header-row" id="header-row">
      <div class="cell">Rank</div>
      <div class="cell">Team</div>
      <div class="cell desktop-only">Record</div>
      <div class="cell">EPA</div>
      <div class="cell desktop-only">Auto EPA</div>
      <div class="cell desktop-only">Tele EPA</div>
      <div class="cell">OPR</div>
    </div>
    <div id="data-container"></div>
  </div>
</div>

<script>
  // DOM Elements
  const setupScreen = document.getElementById('setup-screen');
  const rankingsScreen = document.getElementById('rankings-screen');
  const tbaKeyInput = document.getElementById('tba-key');
  const teamNumberInput = document.getElementById('team-number');
  const yearInput = document.getElementById('year');
  const eventCodeInput = document.getElementById('event-code');
  const eventSuggestions = document.getElementById('event-suggestions');
  const loadBtn = document.getElementById('load-btn');
  const backBtn = document.getElementById('back-btn');
  const errorMsg = document.getElementById('error-msg');
  const dataContainer = document.getElementById('data-container');
  const eventTitle = document.getElementById('event-title');
  const eventSubtitle = document.getElementById('event-subtitle');
  const scrollContainer = document.getElementById('scroll-container');
  const lastUpdatedTop = document.getElementById('last-updated-top');
  
  let autoScrollInterval;
  let refreshInterval;
  let isHovering = false;

  // Initialize Inputs
  yearInput.value = new Date().getFullYear();
  if (localStorage.getItem('tbaApiKey')) tbaKeyInput.value = localStorage.getItem('tbaApiKey');
  if (localStorage.getItem('myTeamNumber')) teamNumberInput.value = localStorage.getItem('myTeamNumber');

  // Fetch Event Suggestions
  async function fetchEventSuggestions() {
    const key = tbaKeyInput.value.trim();
    const team = teamNumberInput.value.trim();
    const year = yearInput.value.trim();
    
    if (!key || !team || !year) return;
    
    try {
      const response = await fetch(`https://www.thebluealliance.com/api/v3/team/frc${team}/events/${year}/simple`, {
        headers: { 'X-TBA-Auth-Key': key }
      });
      if (response.ok) {
        const events = await response.json();
        eventSuggestions.innerHTML = '';
        events.forEach(ev => {
          const option = document.createElement('option');
          option.value = ev.key;
          option.text = ev.name;
          eventSuggestions.appendChild(option);
        });
      }
    } catch (e) { console.error('Error fetching event suggestions:', e); }
  }

  // Event Listeners for Suggestions
  teamNumberInput.addEventListener('change', fetchEventSuggestions);
  yearInput.addEventListener('change', fetchEventSuggestions);
  tbaKeyInput.addEventListener('change', fetchEventSuggestions);

  // Core Fetch & Render Function
  async function fetchAndRenderData() {
    const key = tbaKeyInput.value.trim();
    const eventCode = eventCodeInput.value.trim();
    const myTeam = teamNumberInput.value.trim();
    
    try {
      const headers = { 'X-TBA-Auth-Key': key };
      
      const [rankingsRes, oprsRes, eventRes, statboticsRes] = await Promise.all([
        fetch(`https://www.thebluealliance.com/api/v3/event/${eventCode}/rankings`, { headers }),
        fetch(`https://www.thebluealliance.com/api/v3/event/${eventCode}/oprs`, { headers }),
        fetch(`https://www.thebluealliance.com/api/v3/event/${eventCode}/simple`, { headers }),
        fetch(`https://api.statbotics.io/v3/team_events?event=${eventCode}`)
      ]);

      if (!rankingsRes.ok) throw new Error('Failed to fetch TBA Rankings. Check Event Code & Key.');
      
      const rankingsData = await rankingsRes.json();
      const oprsData = oprsRes.ok ? await oprsRes.json() : { oprs: {} };
      const eventData = eventRes.ok ? await eventRes.json() : { name: eventCode };
      let statboticsData = [];
      if (statboticsRes.ok) statboticsData = await statboticsRes.json();

      // Set timestamp
      const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const updatedText = `Last Updated: ${timeString}`;
      
      eventTitle.textContent = eventData.name;
      eventSubtitle.textContent = rankingsData.rankings ? `${rankingsData.rankings.length} Teams Competing` : 'No rankings available.';
      lastUpdatedTop.textContent = updatedText;
      
      if (!rankingsData.rankings || rankingsData.rankings.length === 0) {
        dataContainer.innerHTML = '<div class="loading">No rankings available for this event yet.</div>';
        return;
      }

      const statboticsMap = {};
      statboticsData.forEach(st => { statboticsMap['frc' + st.team] = st; });

      // Stop scrolling during DOM update to prevent jumping glitches
      stopAutoScroll();
      scrollContainer.scrollTop = 0; 
      dataContainer.innerHTML = ''; 
      
      rankingsData.rankings.forEach(rankObj => {
        const teamKey = rankObj.team_key;
        const teamNum = teamKey.replace('frc', '');
        const rank = rankObj.rank;
        const rec = rankObj.record;
        const recordStr = rec ? `${rec.wins}-${rec.losses}-${rec.ties}` : 'N/A';
        
        const opr = oprsData.oprs && oprsData.oprs[teamKey] ? oprsData.oprs[teamKey].toFixed(1) : 'N/A';
        const sb = statboticsMap[teamKey] || {};
        const epa = sb.epa ? sb.epa.toFixed(1) : 'N/A';
        const autoEpa = sb.auto_epa ? sb.auto_epa.toFixed(1) : 'N/A';
        const teleEpa = sb.teleop_epa ? sb.teleop_epa.toFixed(1) : 'N/A';

        const row = document.createElement('a');
        row.href = `https://www.thebluealliance.com/team/${teamNum}`; 
        row.target = '_blank';
        row.className = 'row';
        
        // HIGHLIGHT LOGIC
        if (myTeam && teamNum === myTeam) {
          row.classList.add('highlight');
        }

        row.innerHTML = `
          <div class="cell rank">#${rank}</div>
          <div class="cell team">${teamNum}</div>
          <div class="cell desktop-only">${recordStr}</div>
          <div class="cell">${epa}</div>
          <div class="cell desktop-only">${autoEpa}</div>
          <div class="cell desktop-only">${teleEpa}</div>
          <div class="cell">${opr}</div>
        `;
        dataContainer.appendChild(row);
      });

      // Append bottom updated text
      const bottomText = document.createElement('div');
      bottomText.className = 'bottom-updated';
      bottomText.textContent = updatedText;
      dataContainer.appendChild(bottomText);

      startAutoScroll();

    } catch (err) {
      console.error(err);
      if (dataContainer.innerHTML.includes('Loading')) {
          setupScreen.style.display = 'flex';
          rankingsScreen.style.display = 'none';
          errorMsg.textContent = err.message || 'Error loading data. Check Event Code and API Key.';
      } else {
          lastUpdatedTop.textContent = 'Update failed. Retrying in 5 mins...';
      }
    }
  }

  // Initial Load Button Logic
  loadBtn.addEventListener('click', () => {
    const key = tbaKeyInput.value.trim();
    const eventCode = eventCodeInput.value.trim();
    const myTeam = teamNumberInput.value.trim();
    
    if (!key) { errorMsg.textContent = 'TBA API Key is required.'; return; }
    if (!eventCode) { errorMsg.textContent = 'Event Code is required.'; return; }
    
    localStorage.setItem('tbaApiKey', key);
    if (myTeam) localStorage.setItem('myTeamNumber', myTeam);
    
    errorMsg.textContent = '';
    setupScreen.style.display = 'none';
    rankingsScreen.style.display = 'flex';
    eventTitle.textContent = eventCode.toUpperCase();
    lastUpdatedTop.textContent = 'Fetching live data...';
    dataContainer.innerHTML = '<div class="loading">Loading data from TBA and Statbotics...</div>';
    
    fetchAndRenderData();
    
    // Set 5 minute interval (300,000 ms)
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(fetchAndRenderData, 300000);
  });

  // Back Button Logic
  backBtn.addEventListener('click', () => {
    stopAutoScroll();
    if (refreshInterval) clearInterval(refreshInterval);
    rankingsScreen.style.display = 'none';
    setupScreen.style.display = 'flex';
  });

  // Auto-Scrolling Logic
  function startAutoScroll() {
    stopAutoScroll();
    let scrollPos = 0;
    
    setTimeout(() => {
      autoScrollInterval = setInterval(() => {
        if (isHovering) return;
        
        const maxScroll = scrollContainer.scrollHeight - scrollContainer.clientHeight;
        if (maxScroll <= 0) return; 
        
        scrollPos += 1; 
        
        if (scrollPos >= maxScroll) {
          isHovering = true; 
          setTimeout(() => {
            scrollPos = 0;
            scrollContainer.scrollTop = 0;
            isHovering = false; 
          }, 3000); 
        } else {
          scrollContainer.scrollTop = scrollPos;
        }
      }, 40); 
    }, 2000);
  }

  function stopAutoScroll() {
    if (autoScrollInterval) clearInterval(autoScrollInterval);
  }

  // Interactivity flags to pause scrolling
  scrollContainer.addEventListener('mouseenter', () => isHovering = true);
  scrollContainer.addEventListener('mouseleave', () => isHovering = false);
  scrollContainer.addEventListener('touchstart', () => isHovering = true);
  scrollContainer.addEventListener('touchend', () => {
    setTimeout(() => isHovering = false, 2500);
  });
</script>
</body>
</html>
